[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "hdl-x"
version = "0.1.0"
description = "Offline, semantics-preserving HDL source translator"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "jinja2>=3.1,<4",
    "pydantic>=2.7,<3",
    "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.12,<1"]
exe = ["pyinstaller>=6.22,<7"]

# pyGHDL 的官方 platform-specific wheels 目前由 GHDL release assets 分发，
# 而不是 PyPI；README 给出经验证的 6.0.0 Windows ABI-specific 安装示例。

[project.scripts]
hdl-x = "hdl_x.cli.main:app"

[project.gui-scripts]
hdl-x-gui = "hdl_x.gui.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hdl_x = ["templates/**/*.j2"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["build"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
